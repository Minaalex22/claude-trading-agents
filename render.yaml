# Render Blueprint: deploys the whole ATS Matrix system (paper mode) as one
# always-on web service, rebuilt automatically on every merge to main.
# Render generates DASHBOARD_PASSWORD; find it under the service's Environment tab.
services:
  - type: web
    name: ats-matrix
    runtime: docker
    # Free plan: no card needed. It sleeps after 15 minutes with no visitors and wakes in about a minute.
    # For 24/7 running and a permanent memory disk, change to "starter" and restore the disk block below.
    plan: free
    branch: main
    autoDeploy: true
    dockerCommand: python -m trading.cloud
    healthCheckPath: /health
    # Free plans can't have a disk, so memory resets on restart. On a paid plan, add this back:
    # disk:
    #   name: events
    #   mountPath: /events
    #   sizeGB: 1
    envVars:
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Two-step login: the secret for your authenticator app's 6-digit codes. Make one with
      # `python -m trading.webauth new-totp` and paste it in the Environment tab. Required before real money.
      - key: DASHBOARD_TOTP_SECRET
        sync: false
      - key: EVENTS_DIR
        value: /events
      # Paper trading on live prices (Coinbase, Yahoo). Orders still go to the paper broker; real money stays
      # locked. Set to "sim" to go back to the simulated practice market.
      - key: MARKET
        value: live
      # Real money (off until all are set): see "Real money" in the README. BRIDGE_TOKEN is shared with the
      # bridge on your computer; the limits are also set there.
      - key: BRIDGE_TOKEN
        sync: false
      - key: LIVE_MAX_ORDER_USD
        sync: false
      - key: LIVE_MAX_DAY_USD
        sync: false
      - key: LIVE_SYMBOLS
        sync: false
      # JARVIS: set these in the Render dashboard (Environment tab). They are never in the repo.
      - key: JARVIS_PASSPHRASE   # optional fixed passphrase; otherwise you choose it on first visit to /jarvis
        sync: false
      - key: ANTHROPIC_API_KEY   # optional: gives JARVIS and the reading room (news + chart reads) a Claude brain
        sync: false
