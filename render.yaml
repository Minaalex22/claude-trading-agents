# Render Blueprint: deploys the whole ATS Matrix system (paper mode) as one
# always-on web service, rebuilt automatically on every merge to main.
# Render generates DASHBOARD_PASSWORD; find it under the service's Environment tab.
services:
  - type: web
    name: ats-matrix
    runtime: docker
    # Starter (paid) plan: runs 24/7 and can mount the persistent disk below. A disk needs a paid plan; turn it on
    # in the Render dashboard (service > Settings > Instance Type) if this blueprint isn't synced. Back on "free"
    # the app still runs but sleeps after 15 minutes and loses its state on every deploy.
    plan: starter
    branch: main
    autoDeploy: true
    dockerCommand: python -m trading.cloud
    healthCheckPath: /health
    # Persistent SSD: only files under /events survive deploys and restarts (state SQLite + WAL checkpoints,
    # desk_audit.jsonl, events, agent memory, practice books). Check it under Render > service > Disks.
    disk:
      name: ats-matrix-state
      mountPath: /events
      sizeGB: 1
    envVars:
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Two-step login: the secret for your authenticator app's 6-digit codes. Make one with
      # `python -m trading.webauth new-totp` and paste it in the Environment tab. Required before real money.
      - key: DASHBOARD_TOTP_SECRET
        sync: false
      - key: EVENTS_DIR
        value: /events
      - key: DESK_DATA_DIR       # same folder: every runtime file goes on the persistent disk
        value: /events
      # Paper trading on live prices (Coinbase, Yahoo). Orders still go to the paper broker; real money stays
      # locked. Set to "sim" to go back to the simulated practice market.
      - key: MARKET
        value: live
      # Read-only trade report at /api/report for Claude or a script (32+ random characters). Optional.
      - key: REPORT_TOKEN
        sync: false
      # Real money (off until all are set): see "Real money" in the README. BRIDGE_TOKEN is shared with the
      # bridge on your computer; the limits are also set there.
      - key: BRIDGE_TOKEN
        sync: false
      - key: LIVE_MAX_ORDER_USD
        sync: false
      - key: LIVE_MAX_DAY_USD
        sync: false
      - key: LIVE_SYMBOLS
        sync: false
      # MetaTrader 5 (e.g. GO Markets) through the MetaApi cloud. Read-only, plus DEMO orders only.
      - key: METAAPI_TOKEN
        sync: false
      - key: METAAPI_ACCOUNT_ID  # optional: found from the token when empty (METAAPI_MT5_DEMO_ACCOUNT_ID also works)
        sync: false
      - key: METAAPI_LIVE_ACCOUNT_ID  # optional: your REAL MT5 account's id in MetaApi, used only when One account is on Live
        sync: false
      - key: ETORO_API_KEY       # optional: eToro public API keys (demo + real portfolio, orders by the Demo/Live switch)
        sync: false
      - key: ETORO_USER_KEY
        sync: false
      - key: LIVE_MONEY          # "on" arms the Live button on One account (you still type GO LIVE to switch)
        sync: false
      - key: ATAS_TOKEN          # 32+ random characters; paste the same into the JarvisFeed indicator in ATAS
        sync: false
      - key: MT5_MODE            # demo = agents' MT5 orders go to the demo account; anything else = paper
        value: demo
      # JARVIS: set these in the Render dashboard (Environment tab). They are never in the repo.
      - key: JARVIS_PASSPHRASE   # optional fixed passphrase; otherwise you choose it on first visit to /jarvis
        sync: false
      - key: ANTHROPIC_API_KEY   # optional: gives JARVIS and the reading room (news + chart reads) a Claude brain
        sync: false
      - key: XAI_API_KEY         # optional: Grok reads X per market, second opinion on /decision, JARVIS fast mode
        sync: false
