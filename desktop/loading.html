<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>JARVIS Trading</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f2f2f2;
    font: 15px -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; padding: 0 24px; }
  .logo { font-weight: 800; letter-spacing: 6px; font-size: 30px; }
  .logo b { color: #FF5C00; }
  .ring { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #222; border-top-color: #FF5C00; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { color: #aaa; max-width: 420px; line-height: 1.5; }
  button { background: #FF5C00; color: #000; border: 0; padding: 10px 22px; font-weight: 700; border-radius: 6px; cursor: pointer; display: none; }
  .err .ring { display: none; } .err button { display: inline-block; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="logo">JARVIS <b>TRADING</b></div>
  <div class="ring"></div>
  <div class="msg" id="msg">Connecting to your trading system...</div>
  <button onclick="window.desktop.retry()">Try again</button>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("state") === "waking") {
    document.getElementById("msg").textContent = "Waking up the server. The first open of the day can take up to a minute.";
  }
  if (q.get("state") === "error") {
    document.getElementById("wrap").classList.add("err");
    document.getElementById("msg").textContent = "Can't reach the trading system right now. Check your internet, then press Try again.";
  }
</script>
</body>
</html>
